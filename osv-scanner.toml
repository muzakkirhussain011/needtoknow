# requires Python 3.11. needtoknow never opens, decodes or saves an image. The entries go when 1.4.0
# drops Python 3.10 (after 2026-10-31), and expire on 2026-11-30 in case that slips. Reviewed 2026-10-22;
# the last seven, published late on 2026-10-21, were added the same day.

