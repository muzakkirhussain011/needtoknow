# Demo principals for the fictional company "Najm Logistics".
# API keys are never stored, only their HMAC-SHA256 digests under a secret the gateway holds in
# RAMPART_KEY_SECRET; the file names that secret by its secret_id, never by its value. These demo
# keys are listed in the README and hashed under a secret published in rampart/identity.py, so the
# gateway accepts this file only with RAMPART_DEMO=1. For a real deployment, start a new file with
# `rampart key-hashing` (a new secret), give each user a key from `rampart new-key` (or hash one you
# have with `rampart hash-key <key>`), and mount the file into the container at run time.
key_hashing:
  scheme: hmac-sha256
  secret_id: ff523d8fa9da0f2b

principals:
  - user_id: alice
    name: Alice (HR business partner)
    team: people-ops
    department: hr
    clearance: confidential
    roles: [employee, pii_reader]
    key_hmac: eb05634be3a7011877dacf8d4ed7092a268e9ef72a8437d5df98e53321d12ca5  # demo-key-alice

  - user_id: bob
    name: Bob (platform engineer)
    team: platform
    department: engineering
    clearance: internal
    roles: [employee]
    key_hmac: bd6c45b9617dcabe30e21a9d7703370d3a5deee1a620ec0edcb2cf31382dd818  # demo-key-bob

  - user_id: carol
