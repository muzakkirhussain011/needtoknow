# Ory Keto configuration for wardowl's tests and the KetoAuthorizer guide: an in-memory store
# with the namespaces in namespaces.ts (a Document's `view` relation lists users and the members of
# groups). Not for production: data lives in memory. `limit.max_batch_check_size` is left at Keto's
# default of 10 on purpose: the tests check that KetoAuthorizer's defaults work against it.
dsn: memory

namespaces:
  location: file:///config/namespaces.ts

serve:
  read:
    host: 0.0.0.0
    port: 4466
  write:
    host: 0.0.0.0
    port: 4467

log:
  level: warn
