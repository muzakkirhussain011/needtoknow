# Ory Keto configuration for needtoknow's tests and the KetoAuthorizer guide: an in-memory store
# with the namespaces in namespaces.ts (a Document's `view` relation lists users and the members of
# groups). Not for production: data lives in memory.
dsn: memory

namespaces:
  location: file:///config/namespaces.ts

serve:
  read:
    host: 0.0.0.0
    port: 4466
  write:
    host: 0.0.0.0
    port: 4467

log:
  level: warn
