name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If this could expose data, bypass the policy or alter the audit trail, please do not file it here.
        Use Security > Report a vulnerability instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the request, the response and the relevant gateway log lines. Mask any real data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. docker compose up -d --build
        2. ...
  - type: input
    id: version
    attributes:
      label: Version or commit
