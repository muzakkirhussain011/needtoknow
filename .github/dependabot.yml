version: 2
updates:
  # pyproject.toml and uv.lock, from which CI and the release install everything by hash.
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: uv
    directory: /examples/gateway
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /examples/gateway
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /.clusterfuzzlite
    schedule: { interval: weekly }
  # The release build tools, pinned by hash in .github/requirements/build.txt.
  - package-ecosystem: pip
    directory: /.github/requirements
    schedule: { interval: weekly }
