name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The four job names lint / policy / test / docker are required checks on main. Keep them.

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: pip install "ruff==0.17.1"
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12", cache: pip }
      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with: { version: 1.21.2 }
      - name: Start OPA with the example policy
        run: |
          opa run --server --addr=127.0.0.1:8181 examples/opa &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8181/health && break; sleep 1; done
      - name: Start OpenFGA
        run: |
          docker run -d --name openfga -p 8080:8080 openfga/openfga:v1.22.0 run
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/healthz && break; sleep 1; done
      - run: pip install -e ".[dev,pgvector,chroma,langchain,llamaindex,otel]" opentelemetry-sdk pgvector
      - name: Library and adapter tests (property-based, against real PostgreSQL, Chroma, OPA and OpenFGA)
        env:
          NEEDTOKNOW_TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test
          NEEDTOKNOW_TEST_OPA_URL: http://127.0.0.1:8181
          NEEDTOKNOW_TEST_OPENFGA_URL: http://127.0.0.1:8080
        run: pytest -q -ra
      - name: Runnable examples
        run: |
          python examples/langchain_quickstart.py
          python examples/llamaindex_quickstart.py
      - name: Benchmark harness (synthetic smoke run against real Chroma and PostgreSQL)
        env:
          NEEDTOKNOW_BENCH_DATABASE_URL: postgresql://test:test@localhost:5432/test
        run: |
          python benchmarks/permissions_bench.py --teams 100 --docs 3000 --queries 15 \
            --selectivity 0.01,0.1,1 --check --out bench.json --markdown bench.md
          cat bench.md >> "$GITHUB_STEP_SUMMARY"
      - name: Load benchmark harness (synthetic smoke run against real PostgreSQL and OPA)
        env:
          NEEDTOKNOW_BENCH_DATABASE_URL: postgresql://test:test@localhost:5432/test
        run: |
          python benchmarks/load_bench.py --docs 3000 --queries 20 --selectivity 0.01,1 --users 1,4 \
            --seconds 2 --ef-search 100 --opa-url http://127.0.0.1:8181 --check --out load.json --markdown load.md
          python benchmarks/load_bench.py --render load.json --markdown rendered.md && cmp load.md rendered.md
          cat load.md >> "$GITHUB_STEP_SUMMARY"

  library:
    name: library (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "${{ matrix.python }}", cache: pip }
      - run: pip install -e ".[dev]"
      - run: pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: The SBOM the release attaches can be generated
        run: |
          python -m venv "$RUNNER_TEMP/sbom"
          "$RUNNER_TEMP/sbom/bin/pip" install --no-deps dist/*.whl
          pip install "cyclonedx-bom==7.5.0"
          cyclonedx-py environment "$RUNNER_TEMP/sbom" --output-format JSON --output-file sbom.cdx.json
          python -c "import json; names = [c['name'] for c in json.load(open('sbom.cdx.json'))['components']]; assert 'needtoknow' in names, names"
      - name: The sdist must not ship the example deployments
        run: |
          tar -tzf dist/*.tar.gz > sdist-files.txt
          if grep -q '/examples/' sdist-files.txt; then echo "examples/ leaked into the sdist"; exit 1; fi

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[docs,langchain,llamaindex,otel]"
      - name: Build the documentation (warnings are errors)
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

  # ---- example deployment: examples/gateway -----------------------------------------------------

  policy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with: { version: 1.21.2 }
      - run: opa check --strict policies
      - run: opa fmt --list --fail policies
      - name: Policy unit tests with coverage gate
        run: |
          opa test policies -v
          cov=$(opa test policies --coverage --format=json | jq '.coverage')
          echo "policy coverage: $cov%"
          awk -v c="$cov" 'BEGIN { exit (c < 90) }'

  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/gateway
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12", cache: pip }
      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with: { version: 1.21.2 }
      - name: Start OPA with the example policies
        run: |
          opa run --server --addr=127.0.0.1:8181 --ignore='*_test.rego' policies &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8181/health && break; sleep 1; done
      - run: pip install -e ".[dev]"
      - name: Unit and integration tests
        env:
          RAMPART_TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test
          RAMPART_TEST_OPA_URL: http://127.0.0.1:8181
        run: pytest -q -ra

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Build the example gateway image
        run: docker build --target runtime -t needtoknow-gateway:ci examples/gateway
