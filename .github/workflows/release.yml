name: Release

# Publishing a GitHub release builds the package and uploads it to PyPI with trusted publishing:
# no API token exists anywhere. PyPI must list a trusted publisher with these values:
#   project needtoknow, owner muzakkirhussain011, repository needtoknow,
#   workflow release.yml, environment pypi.
# The publish action also uploads PEP 740 attestations that tie each file to this workflow run,
# and the attach job puts the same files on the GitHub release with Sigstore signatures, an SBOM
# and the SLSA build provenance the build job records (needtoknow-<version>.intoto.jsonl).

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # to sign the build provenance
      attestations: write # to store it as a GitHub attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      # Every tool that touches the published files is pinned by hash, and the build runs without
      # isolation so it cannot fetch an unpinned backend. pypa/gh-action-pypi-publish checks the
      # metadata before uploading.
      - run: pip install --require-hashes --no-deps -r .github/requirements/build.txt
      - run: python -m build --no-isolation
      - name: The release tag must match the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          if [ ! -f "dist/needtoknow-${version}-py3-none-any.whl" ]; then
            echo "Tag ${TAG} does not match the built package:"; ls dist; exit 1
          fi
      # SLSA build provenance: an in-toto statement, signed with Sigstore, naming this workflow run
      # as the builder of each file. `gh attestation verify <file> --repo <repo>` checks it.
      - id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: { subject-path: dist/* }
      - name: Keep the provenance for the release
        env:
          TAG: ${{ github.event.release.tag_name }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          mkdir provenance
          cp "$BUNDLE" "provenance/needtoknow-${TAG#v}.intoto.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: dist, path: dist/, if-no-files-found: error }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: provenance, path: provenance/, if-no-files-found: error }

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The only job that can obtain a PyPI credential, and it runs no project code.
    environment:
      name: pypi
      url: https://pypi.org/project/needtoknow/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  attach:
    # Attaches the same files PyPI received to the GitHub release, with a CycloneDX SBOM, the
    # build provenance and a Sigstore signature for each file, so downloads can be verified without
    # trusting PyPI.
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false } # for uv.lock
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: dist, path: dist/ }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: provenance, path: dist/ }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { version: "0.13.1", enable-cache: false }
      - name: Install the release tools from uv.lock, by hash
        run: |
          uv export --frozen --no-emit-project --only-group release -o "$RUNNER_TEMP/requirements.txt"
          pip install --require-hashes --no-deps -r "$RUNNER_TEMP/requirements.txt"
      - name: SBOM of the package as installed
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python -m venv "$RUNNER_TEMP/sbom"
          "$RUNNER_TEMP/sbom/bin/pip" install --no-deps dist/*.whl
          cyclonedx-py environment "$RUNNER_TEMP/sbom" --output-format JSON --output-file "dist/needtoknow-${TAG#v}.cdx.json"
      - name: Sign every file with Sigstore
        run: |
          python -m sigstore sign dist/*
      - name: Attach the files, signatures and SBOM to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
