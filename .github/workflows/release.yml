name: Release

# Publishing a GitHub release builds the package and uploads it to PyPI with trusted publishing:
# no API token exists anywhere. PyPI must list a trusted publisher with these values:
#   project needtoknow, owner muzakkirhussain011, repository needtoknow,
#   workflow release.yml, environment pypi.
# The publish action also uploads PEP 740 attestations that tie each file to this workflow run.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: The release tag must match the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          if [ ! -f "dist/needtoknow-${version}-py3-none-any.whl" ]; then
            echo "Tag ${TAG} does not match the built package:"; ls dist; exit 1
          fi
      - uses: actions/upload-artifact@v7
        with: { name: dist, path: dist/, if-no-files-found: error }

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The only job that can obtain a PyPI credential, and it runs no project code.
    environment:
      name: pypi
      url: https://pypi.org/project/needtoknow/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@v1.14.2
