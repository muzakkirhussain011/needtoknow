name: Release

# Publishing a GitHub release builds the package and uploads it to PyPI with trusted publishing:
# no API token exists anywhere. PyPI must list a trusted publisher with these values:
#   project needtoknow, owner muzakkirhussain011, repository needtoknow,
#   workflow release.yml, environment pypi.
# The publish action also uploads PEP 740 attestations that tie each file to this workflow run,
# and the attach job puts the same files on the GitHub release with Sigstore signatures and an SBOM.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: The release tag must match the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          if [ ! -f "dist/needtoknow-${version}-py3-none-any.whl" ]; then
            echo "Tag ${TAG} does not match the built package:"; ls dist; exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: dist, path: dist/, if-no-files-found: error }

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The only job that can obtain a PyPI credential, and it runs no project code.
    environment:
      name: pypi
      url: https://pypi.org/project/needtoknow/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  attach:
    # Attaches the same files PyPI received to the GitHub release, with a CycloneDX SBOM and a
    # Sigstore signature for each file, so downloads can be verified without trusting PyPI.
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: dist, path: dist/ }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: SBOM of the package as installed
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python -m venv "$RUNNER_TEMP/sbom"
          "$RUNNER_TEMP/sbom/bin/pip" install --no-deps dist/*.whl
          pip install "cyclonedx-bom==7.5.0"
          cyclonedx-py environment "$RUNNER_TEMP/sbom" --output-format JSON --output-file "dist/needtoknow-${TAG#v}.cdx.json"
      - name: Sign every file with Sigstore
        run: |
          pip install "sigstore==4.5.0"
          python -m sigstore sign dist/*
      - name: Attach the files, signatures and SBOM to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
