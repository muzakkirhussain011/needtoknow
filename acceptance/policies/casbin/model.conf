# The company's reading rule as a Casbin model: RBAC with domains, one domain per tenant.
#
# A request is (user, tenant, document id, action). A policy row grants a document to a user or to a
# group ("group:legal") inside one tenant, and `g` rows put users in groups inside one tenant, so a
# grant or a membership never crosses tenants.

[request_definition]
r = sub, dom, obj, act

[policy_definition]
p = sub, dom, obj, act

[role_definition]
g = _, _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = r.dom == p.dom && (r.sub == p.sub || g(r.sub, p.sub, r.dom)) && r.obj == p.obj && r.act == p.act
